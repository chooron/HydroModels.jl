name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Run package tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
